name: Build voucher-wifi (.apk)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  OPENWRT_VERSION: "25.12.6"
  TARGET: "ramips/mt76x8"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan file paket
        run: |
          mkdir voucher-wifi
          cp -r Makefile files voucher-wifi/
          sed -i 's/^@@/\t/' voucher-wifi/Makefile
          touch voucher-wifi/files/vouchers.txt
          cd voucher-wifi/files
          chmod +x voucher voucher-setup voucher-wifi.init
          curl -fsSL -o theme_voucher.sh https://raw.githubusercontent.com/openNDS/openNDS/master/community/themespec/theme_voucher/theme_voucher.sh
          test -s theme_voucher.sh

      - name: Pasang dependensi build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip python3 zstd

      - name: Unduh OpenWrt SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}"
          SDK=$(curl -fsSL "$BASE/" | grep -oE 'openwrt-sdk-[^"<> ]*\.tar\.(zst|xz)' | head -n1)
          echo "SDK: $SDK"
          curl -fsSLO "$BASE/$SDK"
          mkdir sdk
          tar -xf "$SDK" -C sdk --strip-components=1

      - name: Build paket
        working-directory: sdk
        run: |
          cp -r ../voucher-wifi package/voucher-wifi
          ./scripts/feeds update packages
          ./scripts/feeds install opennds
          make defconfig
          make package/voucher-wifi/compile V=s

      - name: Unggah hasil
        uses: actions/upload-artifact@v4
        with:
          name: voucher-wifi-apk
          path: sdk/bin/packages/**/voucher-wifi*.apk

      - name: Rilis publik supaya router bisa mengunduh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find sdk/bin/packages -name 'voucher-wifi*.apk' | head -n1)
          cp "$APK" voucher-wifi.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest voucher-wifi.apk --title "voucher-wifi terbaru" --notes "Build otomatis"
